[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathtrace"
version = "0.2.0"
description = "Image contour to Fourier equation reconstruction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3.0", "Pillow>=10.0,<13.0", "opencv-python-headless>=4.9,<5.0", "matplotlib>=3.8,<4.0", "streamlit>=1.35,<2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0", "ruff>=0.6,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
